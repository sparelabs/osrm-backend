name: docker-publish

# Publishes a Docker image of this OSRM build to GHCR (osrm-extract / osrm-contract /
# osrm-routed / ...), so map compilation can run the exact same build as routing
# (which consumes the npm prebuilt). The image tag mirrors package.json's version.
#
# Triggers: this branch (to publish the current release tag, which predates this
# workflow), any future matching release tag, and manual dispatch.
on:
  push:
    branches:
      - caitlin/osrm-docker-publish
    tags:
      - 'v[1-9]+.[0-9]+.[0-9]+-[a-zA-Z]+.[0-9]+'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag from package.json
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            DOCKER_TAG=v${{ steps.meta.outputs.version }}
          tags: ghcr.io/sparelabs/osrm-backend:v${{ steps.meta.outputs.version }}
